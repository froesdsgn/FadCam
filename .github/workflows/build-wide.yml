name: Build FadCam Snapcam Physical Wide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Transformar FadCam em Snapcam
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          old = 'applicationId = "com.fadcam"'
          new = 'applicationId = "org.codeaurora.snapcam"'

          if old not in s:
              raise SystemExit("ERRO: applicationId nao encontrado")

          s = s.replace(old, new, 1)

          old_suffix = 'applicationIdSuffix = ".beta"'

          if old_suffix in s:
              s = s.replace(
                  old_suffix,
                  '// applicationIdSuffix removido para Snapcam',
                  1
              )

          p.write_text(s)

          print("OK: pacote alterado para org.codeaurora.snapcam")
          PY

      - name: Aplicar correcao Poco F5 ultrawide
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/fadcam/services/RecordingService.java"
          )

          s = p.read_text()

          def trocar(old, new, nome):
              global s

              if old not in s:
                  raise SystemExit(
                      "ERRO: nao achei o trecho: " + nome
                  )

              s = s.replace(old, new, 1)
              print("OK:", nome)


          # =========================================================
          # 1. Variavel que guarda qual sensor fisico queremos usar
          # =========================================================

          trocar(
              '    private boolean pendingStartRecording = false;',
              '''    private boolean pendingStartRecording = false;

              // POCO F5 PHYSICAL CAMERA PATCH
              private String forcedPhysicalCameraId = null;''',
              "variavel forcedPhysicalCameraId"
          )


          # =========================================================
          # 2. Limpa a camera fisica sempre que abrir uma nova camera
          # =========================================================

          trocar(
              '        String cameraToOpenId = null;',
              '''        String cameraToOpenId = null;

                  // POCO F5 PHYSICAL CAMERA PATCH
                  forcedPhysicalCameraId = null;''',
              "reset camera fisica"
          )


          # =========================================================
          # 3. Quando o ID escolhido for uma camera fisica,
          #    descobre a camera LOGICA que contem esse sensor.
          #
          #    Em vez de:
          #       openCamera(sensor fisico)
          #
          #    faremos:
          #       openCamera(camera logica)
          #       + setPhysicalCameraId(sensor fisico)
          # =========================================================

          trocar(
              '                    cameraToOpenId = preferredBackId;',
              '''                    cameraToOpenId = preferredBackId;

                      // POCO F5 PHYSICAL CAMERA PATCH
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {

                          for (String logicalId : basicCameraIds) {

                              try {

                                  CameraCharacteristics logicalChars =
                                          cameraManager.getCameraCharacteristics(logicalId);

                                  Integer logicalFacing =
                                          logicalChars.get(
                                                  CameraCharacteristics.LENS_FACING
                                          );

                                  Set<String> physicalIds =
                                          logicalChars.getPhysicalCameraIds();

                                  if (
                                          logicalFacing != null
                                          && logicalFacing
                                              == CameraCharacteristics.LENS_FACING_BACK
                                          && physicalIds != null
                                          && physicalIds.contains(preferredBackId)
                                  ) {

                                      forcedPhysicalCameraId = preferredBackId;

                                      // IMPORTANTE:
                                      // abre a camera logica e nao o sensor fisico
                                      cameraToOpenId = logicalId;

                                      FLog.i(
                                              TAG,
                                              "POCO WIDE PATCH: physical="
                                                      + forcedPhysicalCameraId
                                                      + " logical="
                                                      + cameraToOpenId
                                      );

                                      break;
                                  }

                              } catch (Exception physicalLookupError) {

                                  FLog.w(
                                          TAG,
                                          "POCO WIDE PATCH: erro verificando logicalId "
                                                  + logicalId,
                                          physicalLookupError
                                  );
                              }
                          }
                      }''',
              "roteamento fisica para logica"
          )


          # =========================================================
          # 4. Faz a Surface da sessao usar especificamente
          #    o sensor fisico escolhido.
          # =========================================================

          trocar(
              '                    outputs.add(new android.hardware.camera2.params.OutputConfiguration(s));',
              '''                    android.hardware.camera2.params.OutputConfiguration output =
                              new android.hardware.camera2.params.OutputConfiguration(s);

                      if (forcedPhysicalCameraId != null) {

                          try {

                              output.setPhysicalCameraId(
                                      forcedPhysicalCameraId
                              );

                              FLog.i(
                                      TAG,
                                      "POCO WIDE PATCH: output usando physicalId="
                                              + forcedPhysicalCameraId
                              );

                          } catch (Exception physicalOutputError) {

                              FLog.e(
                                      TAG,
                                      "POCO WIDE PATCH: falha no setPhysicalCameraId",
                                      physicalOutputError
                              );
                          }
                      }

                      outputs.add(output);''',
              "OutputConfiguration physical camera"
          )


          p.write_text(s)

          print("")
          print("==============================================")
          print("PATCH POCO F5 ULTRAWIDE APLICADO COM SUCESSO")
          print("==============================================")
          PY

      - name: Conferir alteracoes
        run: |
          echo "===== PACKAGE ====="
          grep -n "applicationId =" app/build.gradle.kts | head -5

          echo ""
          echo "===== PATCH ====="
          grep -n "POCO WIDE PATCH" \
            app/src/main/java/com/fadcam/services/RecordingService.java

      - name: Baixar Media3 modificado do FadCam
        run: |
          git clone \
            --depth 1 \
            https://github.com/anonfaded/media3-patched.git \
            /tmp/media3-patched

      - name: Dar permissao ao Gradle
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDefaultDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: FadCam-Snapcam-PocoF5-Ultrawide
          path: app/build/outputs/apk/**/*.apk
